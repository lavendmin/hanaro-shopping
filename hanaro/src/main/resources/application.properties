spring.application.name=hanaro
# on dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3308/hanarodb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=hanaro
spring.datasource.password=12345678
# everywhere
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.batch_size=10
# logging
logging.level.org.hibernate=ERROR
# batch
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
# JWT
spring.jwt.secret="QFPg8v69EpZxgKNbGThRGoHjYxXsXdSddHFLWCPnXdY="
# swagger
springdoc.swagger-ui.path=/swagger.html
springdoc.api-docs.path=/hanaro/api-docs
# upload files
spring.servlet.multipart.location=src/main/resources/static/origin
spring.servlet.multipart.max-file-size=512KB
spring.servlet.multipart.max-request-size=3MB
upload.path=src/main/resources/static/upload
